services:
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    environment:
      - ORACLE_SID=XE
      - ORACLE_PDB=XEPDB1
      - ORACLE_PWD=Oracle123
    ports:
      - 1521:1521
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backup:/opt/oracle/backup
      # Auto-build the schema on a FRESH volume: the wrapper runs once (image's
      # setup dir), switches to XEPDB1, and runs the numbered scripts (mounted
      # outside the setup dir so they aren't each executed in the wrong container).
      # Paths are relative to this compose file (repo root).
      - ./src/db/oracle/init/00_init.sql:/opt/oracle/scripts/setup/00_init.sql:ro
      - ./src/db/oracle/scripts:/opt/oracle/hss-scripts:ro
    healthcheck:
      test:
        [
          "CMD",
          "sqlplus",
          "-L",
          "sys/Oracle123@//localhost:1521/XEPDB1 as sysdba",
          "@healthcheck.sql",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2.5-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 10

volumes:
  oracle-data:
  oracle-backup:
