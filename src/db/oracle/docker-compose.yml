version: '3.1'
services:
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    environment:
      - ORACLE_SID=XE
      - ORACLE_PDB=XEPDB1
      - ORACLE_PWD=Oracle123
    ports:
      - 1521:1521
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backup:/opt/oracle/backup
      # Auto-build the schema on a FRESH container: the wrapper runs once (setup dir),
      # switches to XEPDB1, and runs the numbered scripts (mounted outside the setup
      # dir so they aren't executed individually in the wrong container).
      - ./init/00_init.sql:/opt/oracle/scripts/setup/00_init.sql:ro
      - ./scripts:/opt/oracle/hss-scripts:ro
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/Oracle123@//localhost:1521/XEPDB1 as sysdba", "@healthcheck.sql"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - oracle-network

volumes:
  oracle-data:
  oracle-backup:

networks:
  oracle-network:
    name: "oracle-network"
      